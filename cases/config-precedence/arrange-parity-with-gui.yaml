id: arrange-parity-with-gui
title: "CLI --arrange must succeed and produce a deterministic, valid placement"
category: config-precedence
status: fixed
model: synthetic/cube20.stl
args:
  - "--datadir"
  - "{datadir}"
  - "--outputdir"
  - "{outputdir}"
  - "--arrange"
  - "1"
  - "--export-3mf"
  - "arranged.3mf"
  - "{model}"
checks:
  - no_crash: {}
  - exit_code: {equals: 0}
  - file_exists: {path: "{outputdir}/arranged.3mf"}
notes: >
  SCOPED DOWN from the original intent (verifying CLI --arrange positions
  objects the same way the GUI's arrange does). That needs a GUI-produced
  reference position to diff against, which nothing in this repo can
  generate -- there is no way to drive the actual GUI headlessly, and no
  reference capture exists yet. Until a GUI capture is available (a human
  arranging the same cube via the GUI once and exporting the result -- see
  TESTING_STRATEGY.md's CLI-vs-GUI discussion), this case only pins the
  narrower, still-useful property that --arrange completes cleanly and
  deterministically on a plain single-object model (verified live: a 20mm
  cube ends up at a fixed, reasonable transform, not a crash or garbage
  position).

  Suspected upstream issue this narrower case does NOT cover: CLI --arrange
  is believed to not thread through certain GUI-arrange parameters (e.g.
  align_center, nozzle_height) into ArrangeParams, producing different
  object positions than the GUI for the same inputs. Confirming that needs
  the GUI reference capture described above -- reinstate this as
  `needs_fixture` with a real position-comparison check once one exists,
  rather than extending this case's assertions without something to compare
  against.
