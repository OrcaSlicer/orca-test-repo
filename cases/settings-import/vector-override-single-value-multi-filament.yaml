id: vector-override-single-value-multi-filament
category: settings-import
status: fixed
title: A single-value per-filament CLI override on a multi-filament project must not zero the other filaments
model: p1s_multicolor.3mf
args:
- --datadir
- '{datadir}'
- --outputdir
- '{outputdir}'
- --allow-newer-file
- --allow-mix-temp
- --nozzle-temperature=211
- --slice
- '0'
- '{model}'
checks:
- no_crash: {}
- exit_code:
    equals: 0
- gcode_config_vector_nonzero:
    key: nozzle_temperature
- gcode_config_value:
    key: nozzle_temperature
    equals:
    - '211'
    - '211'
    - '211'
    - '211'
notes: |
  Regression class (settings import / precedence): `--nozzle-temperature=211` on
  a 4-filament project replaces the whole vector with a 1-element one; the
  G-code then records `nozzle_temperature = 211,0,0,0`, i.e. three filaments
  would print at 0 C (without --allow-mix-temp this is masked by exit 194,
  "temperature difference too large"). Whether the right fix is to broadcast the
  single value or to reject a short vector is upstream's call; either way no
  filament may silently end up with a zero temperature, which is what the check
  asserts (a clean rejection leaves no G-code and fails this case inside xfail,
  so it stays a tracked open item until a fix that produces G-code with non-zero
  values lands). On a single-filament project the same override works
  (verified).

  Fixed on main: the single value is broadcast to every filament and the slice
  succeeds (nozzle_temperature = 211,211,211,211); the checks pin that result.
