id: variant-key-zero-filled-on-full-filament-load
title: A per-filament variant key must not be zero-filled for filaments 2..N on a full filament load
category: settings-import
status: fixed
model: p1s_multicolor.3mf
args:
  - --datadir
  - '{datadir}'
  - --outputdir
  - '{outputdir}'
  - --allow-newer-file
  - --load-filaments
  - '{datadir}/system/BBL/filament/Bambu PLA Matte @BBL X1C.json;{datadir}/system/BBL/filament/Bambu PLA Basic @BBL X1C.json;{datadir}/system/BBL/filament/Bambu PLA Tough @BBL X1C.json;{datadir}/system/BBL/filament/Bambu PLA Silk @BBL X1C.json'
  - --slice
  - '0'
  - '{model}'
checks:
  - no_crash: {}
  - exit_code: {equals: 0}
  - gcode_config_vector_uniform: {key: filament_cooling_before_tower, length: 4}
  - gcode_config_vector_nonzero: {key: filament_ramming_volumetric_speed_nc}
notes: >
  Same variant-stride mechanism as
  partial-load-filaments-variant-key-zero-filled, but reached without any
  partial load: a full four-of-four filament load on a four-filament project.
  Keys the loaded presets leave unset keep the single registered default in the
  merged config, and the variant-stride read that builds the applied config
  then writes it for filament 1 and zero for the rest. Observed on main:
  filament_cooling_before_tower recorded as 10,0,0,0 and
  filament_ramming_volumetric_speed_nc as -1,0,0,0.

  Fixed on main once --load-filaments presets were resolved through their
  inherits chain: every loaded preset now carries these keys, so the columns
  are complete; the partial-load sibling's short column now keeps its first
  value too.

  Ramming catches a zero-filled tail (-1,0,0,0). Cooling must be a complete,
  uniform four-element column. Its value is not pinned, because it depends on
  the profiles, which may leave the registered default of 10 or set their own.
