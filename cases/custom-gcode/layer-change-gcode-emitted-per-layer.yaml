id: layer-change-gcode-emitted-per-layer
title: layer_change_gcode is emitted once per layer
category: custom-gcode
status: fixed
model: synthetic/cube20.stl
args:
- --datadir
- '{datadir}'
- --outputdir
- '{outputdir}'
- --load-settings
- '{datadir}/system/BBL/machine/Bambu Lab X1 Carbon 0.4 nozzle.json;{datadir}/system/BBL/process/0.20mm Standard @BBL X1C.json'
- --load-filaments
- '{datadir}/system/BBL/filament/Bambu PLA Basic @BBL X1C.json'
- --layer-change-gcode=; PROBE_LAYER_CHANGE_GCODE
- --slice
- '0'
- '{model}'
checks:
- no_crash: {}
- exit_code:
    equals: 0
- gcode_config_value:
    key: layer_change_gcode
    equals: ; PROBE_LAYER_CHANGE_GCODE
- gcode_body_count:
    text: PROBE_LAYER_CHANGE_GCODE
    equals: 100
notes: |
  The 20 mm cube at 0.2 mm layer height is 100 layers; the snippet must be
  emitted exactly once per layer. A change in the layer count itself (layer
  height / first-layer handling) also surfaces here.
