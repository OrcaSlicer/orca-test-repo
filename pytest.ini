[pytest]
testpaths = .
python_files = test_*.py
xfail_strict = true
markers =
    crash: process must not crash (segfault/abort) under crafted CLI input
    cli_parsing: --help text and CLI argument parsing correctness
    config_precedence: CLI vs GUI config precedence/override/clamping parity
    geometry_bounds: bed-shape, array-length, and other bounds/OOB correctness
    settings_import: importing presets/overrides and recording them in the outputs
    cli_flags: behaviour of the CLI-only action/transform/misc flags
    cli_overrides: every config option set on the command line must land (override sweep)
    custom_gcode: custom G-code snippets are emitted in the sliced G-code where they belong
    per_object: per-object and per-layer-range settings embedded in a 3mf are applied and take precedence
